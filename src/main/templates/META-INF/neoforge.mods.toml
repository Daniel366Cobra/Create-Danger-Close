modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Daniel366Cobra/Create-Danger-Close/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/create-danger-close"
logoFile="icon.png"
credits="Create, Create: Big Cannons and Create: Simulated Teams, for inspiration"
authors="Daniel366Cobra"

description='''
Immersive gunnery for Create Aeronautics.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="[6.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="createbigcannons"
type="required"
versionRange="[5.11.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aeronautics"
type="required"
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"