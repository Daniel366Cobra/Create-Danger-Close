org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
loader_version_range=[1,)

## Mod Properties
mod_id=createdangerclose
mod_name=Create Danger Close
mod_license=MIT (code), All Rights Reserved (assets)
mod_version=1.0.0
mod_group_id=io.github.daniel366cobra.createdangerclose

# Dependency versions
create_neoforge_version=6.0.10-280
ponder_neoforge_version=1.0.82
flywheel_neoforge_version=1.0.6
registrate_neoforge_version=MC1.21-1.3.0+67

ritchies_projectile_library_version=2.1.2
# Optional; the version Simulated pulls in.
cc_tweaked_version=1.115.1
# Dev client only (copied into run/mods), not required by the mod.
sodium_version=mc1.21.1-0.8.13-neoforge
iris_version=1.8.14-beta.1+1.21.1-neoforge
# Tests only
junit_version=5.11.4

# The oldest version of each required mod that players may run, as the mod itself declares
# it. The mod is built against exactly these (Create through create_neoforge_version above,
# which must match), so anything newer fails to compile; they also become the dependency
# ranges in neoforge.mods.toml. Tested floors (2026-10-08): below them the game breaks.
# Simulated's version also sets Aeronautics and Offroad, which ship with it as one bundle.
create_min_version=6.0.10
create_big_cannons_min_version=5.11.5
simulated_min_version=1.3.0
sable_min_version=2.0.3